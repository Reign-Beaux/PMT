# Configuración del backend de pruebas e2e (CONFIG_FILE en playwright.config.ts).
# Nunca apunta al 8080: la base llega por DATABASE_CONNECTION_STRING desde
# PMT_TEST_DATABASE_URL, validada como pmt_frontend_test. El dueño de pruebas
# llega por OWNER_EMAIL, OWNER_PASSWORD y OWNER_USERNAME desde e2e/harness/env.ts
# y solo se crea si la base no tiene usuarios.
app:
  public_url: http://localhost:5173
server:
  addr: 127.0.0.1:8090
database:
  connection_string: changeme # override: DATABASE_CONNECTION_STRING
frontend:
  dist: ../../dist
auth:
  cookie_secure: false
owner:
  email: "" # override: OWNER_EMAIL
  password: "" # override: OWNER_PASSWORD
  username: "" # override: OWNER_USERNAME
